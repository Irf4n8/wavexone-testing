[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    copy_trading: Copy Trading test suite
    mam: MAM test suite
    pamm: PAMM test suite
    smoke: Quick sanity smoke tests
    p0: Phase 1 (P0) critical scenarios
    p1: Phase 2 (P1) core domain scenarios
    p2: Phase 3 (P2) edge and resilience scenarios
    non_trading: Non-trading validation scenarios
    trading: Trading scenarios requiring live order execution
    stateful: Stateful finite state machine test scenarios
    risk: Risk management and stop-out scenarios
    negative: Negative validation and idempotency scenarios
    cleanup: Safe teardown and clean-slate scenarios
    regression: Full regression test suite
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

